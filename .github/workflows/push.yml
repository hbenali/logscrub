# Tag-only jobs (release, docker) cannot be tested without releasing, so every
# push runs a goreleaser snapshot ("release-dry-run") and an arm64 image build
# ("image-smoke") to catch their failures early.
#
# All third-party actions are pinned to commit SHAs (the repo enforces it);
# Dependabot (github-actions) keeps them current.
name: Build, Lint, Test, and Release
on: push

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # zsh and fish let the completion-script syntax tests run (they skip when a
      # shell is missing); groff lints the man page.
      - name: Install shells and groff
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish groff-base
      - run: go vet ./...
      - run: go test -race -cover ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: matrix.os == 'ubuntu-latest'
      # A short fuzz run on every push: arbitrary bytes must never panic, leak a
      # maskable string, or make the prefilter change the output.
      - name: Fuzz the engine (30 s)
        if: matrix.os == 'ubuntu-latest'
        run: go test ./internal/scrub -run '^$' -fuzz FuzzScrub -fuzztime 30s

  release-dry-run:
    name: Release dry run (goreleaser snapshot, packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Install the .deb and check what it ships
        run: |
          sudo dpkg -i dist/*_linux_amd64.deb
          logscrub --version
          test -s /usr/share/man/man1/logscrub.1.gz
          test -s /usr/share/bash-completion/completions/logscrub
          printf 'password=hunter2\n' | logscrub | grep -q 'REDACTED:kv-secret'
          # archives carry the man page, completions and licence
          tar -tzf dist/*_linux_amd64.tar.gz | sort
          for f in LICENSE README.md logscrub.1 completions/logscrub.bash; do tar -tzf dist/*_linux_amd64.tar.gz | grep -qx "$f"; done

  image-smoke:
    name: Image smoke test (linux/arm64 under QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          build-args: |
            VERSION=smoke
            REVISION=${{ github.sha }}
          tags: logscrub:smoke
      - name: Run it
        run: |
          docker run --rm --platform linux/arm64 logscrub:smoke --version
          printf 'user=bob@example.org password=hunter2\n' | docker run --rm -i --platform linux/arm64 logscrub:smoke | tee out.txt
          grep -q 'REDACTED:email' out.txt && grep -q 'REDACTED:kv-secret' out.txt
          # a non-loopback bind must be refused (the exit status is non-zero by design)
          out=$(docker run --rm --platform linux/arm64 logscrub:smoke serve --addr 0.0.0.0:0 2>&1 || true)
          echo "$out" | grep -q 'allow-remote'

  action-test:
    name: GitHub Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A clean corpus passes
        uses: ./
        with:
          files: testdata/clean/*.log
      - name: Make a file with a (made-up) secret in it
        shell: bash
        run: printf 'password=%s\n' hunter2 > "$RUNNER_TEMP/dirty.log"
      - name: A dirty file must fail the action
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          files: ${{ runner.temp }}/dirty.log
      - name: The dirty run really failed
        shell: bash
        run: test "${{ steps.dirty.outcome }}" = failure
      - name: SARIF output is written (needs 1.1.0 or later)
        id: sarif
        continue-on-error: true
        uses: ./
        with:
          version: 1.1.0
          files: ${{ runner.temp }}/dirty.log
          sarif-file: ${{ runner.temp }}/logscrub.sarif
      - name: The run failed (a secret is present) and the SARIF file holds a finding but not the secret
        shell: bash
        run: |
          test "${{ steps.sarif.outcome }}" = failure
          grep -q '"version": "2.1.0"' "$RUNNER_TEMP/logscrub.sarif"
          grep -q '"ruleId": "kv-secret"' "$RUNNER_TEMP/logscrub.sarif"
          ! grep -q hunter2 "$RUNNER_TEMP/logscrub.sarif"
      - name: Asking for no files is an error, not a hang
        id: nofiles
        continue-on-error: true
        uses: ./
        with:
          files: ""
      - name: It failed
        shell: bash
        run: test "${{ steps.nofiles.outcome }}" = failure

  release:
    name: Release binaries (draft)
    needs: [test, release-dry-run]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads tags/history for the changelog
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # .goreleaser.yaml sets release.draft: true, because releases are immutable
      # once published; publish the draft by hand after writing the notes.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # every archive and package listed in checksums.txt, not just the file itself
          subject-checksums: dist/checksums.txt

  docker:
    name: Docker (GHCR and Docker Hub)
    needs: [test, image-smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      # Docker Hub is used only when both repository secrets exist, so a missing
      # secret cannot break a tag build (tags can't be redone once published).
      HAVE_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # DOCKERHUB_TOKEN is an access token with read/write scope on hbenali/logscrub,
      # not the account password.
      - name: Log in to Docker Hub
        if: env.HAVE_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/hbenali/logscrub:${{ github.ref_name }}
            ghcr.io/hbenali/logscrub:latest
            ${{ env.HAVE_DOCKERHUB == 'true' && format('docker.io/hbenali/logscrub:{0}', github.ref_name) || '' }}
            ${{ env.HAVE_DOCKERHUB == 'true' && 'docker.io/hbenali/logscrub:latest' || '' }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/hbenali/logscrub
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest build provenance (Docker Hub)
        if: env.HAVE_DOCKERHUB == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/hbenali/logscrub
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
