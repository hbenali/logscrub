# Check with `goreleaser check` and `goreleaser release --snapshot --clean --skip=publish`.
version: 2

project_name: logscrub

before:
  hooks:
    - go mod tidy
    # Packages ship the man page gzipped (Debian policy); .build/ is git-ignored.
    - sh -c 'mkdir -p .build && gzip -9nc docs/man/logscrub.1 > .build/logscrub.1.gz'

builds:
  - main: ./cmd/logscrub
    binary: logscrub
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: docs/man/logscrub.1
        dst: logscrub.1
      - src: cmd/logscrub/completions/*
        dst: completions
        strip_parent: true

nfpms:
  - id: packages
    package_name: logscrub
    vendor: hbenali
    homepage: https://github.com/hbenali/logscrub
    maintainer: Houssem Ben Ali <hbenali.tn@gmail.com>
    description: Mask secrets and personal data in logs so they can be shared safely
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: .build/logscrub.1.gz
        dst: /usr/share/man/man1/logscrub.1.gz
      - src: cmd/logscrub/completions/logscrub.bash
        dst: /usr/share/bash-completion/completions/logscrub
      - src: cmd/logscrub/completions/_logscrub
        dst: /usr/share/zsh/site-functions/_logscrub
      - src: cmd/logscrub/completions/logscrub.fish
        dst: /usr/share/fish/vendor_completions.d/logscrub.fish
      - src: LICENSE
        dst: /usr/share/doc/logscrub/copyright
        packager: deb
      - src: LICENSE
        dst: /usr/share/licenses/logscrub/LICENSE
        packager: rpm
      - src: LICENSE
        dst: /usr/share/licenses/logscrub/LICENSE
        packager: apk

checksum:
  name_template: checksums.txt

changelog:
  use: github

# Releases are immutable once published: create a DRAFT with the assets
# attached, then publish it by hand after writing the notes
# (gh release edit <tag> --notes-file notes.md --draft=false).
release:
  draft: true
