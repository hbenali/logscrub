# The in-browser demo (the real UI with the engine compiled to WebAssembly) on
# GitHub Pages: https://hbenali.github.io/logscrub/ . Pasted text never leaves the
# visitor's browser, which the demo test below asserts in a real Chrome.
#
# All third-party actions are pinned to commit SHAs (the repo enforces it).
name: Demo (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'scripts/build-demo.sh'
      - 'scripts/demo-test.mjs'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe, for the version shown in the page
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/build-demo.sh _site "$(git describe --tags --always)"
      # Chrome and Node come with the runner image.
      - name: Test the demo in a real browser
        run: node scripts/demo-test.mjs _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # prove to Pages that the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
