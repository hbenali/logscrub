<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0f12; --surface:#13161b; --accent:#4f8ef7; --text:#e2e4e9; --muted:#8a909e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 480px; overflow: hidden; background: var(--bg); }
  .stage {
    position: relative; width: 1440px; height: 480px; overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif; color: var(--text);
    background:
      radial-gradient(900px 440px at 76% 45%, rgba(79,142,247,0.20), transparent 62%),
      radial-gradient(600px 360px at 8% 115%, rgba(106,209,158,0.10), transparent 60%),
      linear-gradient(180deg, #0f1217 0%, #0b0d10 100%);
  }
  /* faint log-line texture */
  .stage::before {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 28px);
    mask-image: linear-gradient(90deg, rgba(0,0,0,0.9), transparent 70%);
  }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .brand svg { width: 52px; height: 52px; filter: drop-shadow(0 0 18px rgba(79,142,247,0.55)); }
  .brand span { font-size: 56px; font-weight: 800; letter-spacing: -2.5px; }
  h1 { font-size: 36px; line-height: 1.12; font-weight: 700; letter-spacing: -1px; margin-bottom: 14px; }
  h1 em { font-style: normal; color: var(--accent); }
  p.sub { font-size: 18.5px; line-height: 1.4; color: var(--muted); font-weight: 500; margin-bottom: 22px; max-width: 560px; }
  .chips { display: none; }
  .chip { font-size: 14.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px; color: #c9d1e0;
          background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); }
  .cmd { display: inline-flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 500;
         padding: 11px 18px; border-radius: 12px; background: #0a0c0f; border: 1px solid rgba(255,255,255,0.14); width: fit-content; }
  .cmd .p { color: #6ad19e; } .cmd .a { color: var(--accent); }
  .shot {
    position: absolute; left: 760px; top: 78px; width: 640px;
    border-radius: 16px; overflow: hidden; background: var(--surface);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 40px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(79,142,247,0.18), 0 0 90px rgba(79,142,247,0.20);
    transform: perspective(1800px) rotateY(-6deg) rotateX(1.5deg); transform-origin: left center;
  }
  .bar { height: 32px; background: #181c23; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #3a3f4b; display: block; }
  .bar i:nth-child(1){background:#f77070} .bar i:nth-child(2){background:#f7b955} .bar i:nth-child(3){background:#6ad19e}
  .bar b { margin-left: 12px; font: 500 12px 'JetBrains Mono', monospace; color: var(--muted); }
  /* crop of the real UI: the log lines, at ~1.25x so the colors read */
  .view { width: 640px; height: 300px; overflow: hidden; position: relative; background: #0d0f12; }
  .view img { position: absolute; width: 1180px; height: auto; left: -24px; top: -590px; }
  .fade { position: absolute; left: 640px; top: 78px; width: 700px; height: 520px; pointer-events: none;
          background: linear-gradient(90deg, rgba(13,15,18,0.0) 80%, rgba(13,15,18,0.0)); }
</style></head>
<body><div class="stage">
  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 20 20" fill="none"><rect x="1" y="1" width="18" height="18" rx="4" stroke="#4f8ef7" stroke-width="1.5"/><path d="M4.5 6.5h11M4.5 10h7M4.5 13.5h9" stroke="#4f8ef7" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>logscrub</span>
    </div>
    <h1>Share your logs,<br>not your <em>secrets</em>.</h1>
    <p class="sub">Masks secrets and personal data in logs before they reach a ticket, a chat or a bug report.</p>
    <div class="chips"><span class="chip">Linear-time</span><span class="chip">Pseudonyms</span><span class="chip">Local web UI</span><span class="chip">Single binary</span></div>
    <div class="cmd"><span class="p">$</span><span>some-command | <span class="a">logscrub</span> &gt; clean.log</span></div>
  </div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i><b>logscrub serve · 127.0.0.1:8080</b></div><div class="view"><img src="../screenshots/overview.png"></div></div>
</div></body></html>
