name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is this?
      options:
        - New feature
        - Improvement to an existing feature
        - Security / hardening
        - Deployment (Docker, packaging)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The situation and what is hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Behaviour, option names, or a sketch of the UI, if you have an idea.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you do today, and whether an existing option nearly covers it.
