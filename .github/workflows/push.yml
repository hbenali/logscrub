# UNTESTED SKETCH for the Go variant. The Node variant (variants/node) is the
# tested one; this follows the same shape. Run it on a throwaway repo and fix
# whatever breaks BEFORE relying on it, especially the tag-only jobs (they only
# run when you push a tag, which also publishes).
#
# All third-party actions are pinned to commit SHAs (the repo enforces it);
# Dependabot (github-actions) keeps them current.
name: Build, Lint, Test, and Release
on: push

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -cover ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

  release:
    name: Release binaries (draft)
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads tags/history for the changelog
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # .goreleaser.yaml sets release.draft: true, because releases are immutable
      # once published; publish the draft by hand after writing the notes.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt

  docker:
    name: Docker (GHCR and Docker Hub)
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      # Docker Hub is used only when both repository secrets exist, so a missing
      # secret cannot break a tag build (tags can't be redone once published).
      HAVE_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # DOCKERHUB_TOKEN is an access token with read/write scope on hbenali/logscrub,
      # not the account password.
      - name: Log in to Docker Hub
        if: env.HAVE_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/hbenali/logscrub:${{ github.ref_name }}
            ghcr.io/hbenali/logscrub:latest
            ${{ env.HAVE_DOCKERHUB == 'true' && format('docker.io/hbenali/logscrub:{0}', github.ref_name) || '' }}
            ${{ env.HAVE_DOCKERHUB == 'true' && 'docker.io/hbenali/logscrub:latest' || '' }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/hbenali/logscrub
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest build provenance (Docker Hub)
        if: env.HAVE_DOCKERHUB == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/hbenali/logscrub
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
