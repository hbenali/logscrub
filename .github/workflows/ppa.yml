# Uploads signed Debian source packages to the Launchpad PPA (ppa:hbenali/logscrub).
# A separate workflow on purpose: a failure here must never affect the release
# workflow (tags can't be redone once published). Run it by hand to test or to
# re-upload: Actions > PPA upload > Run workflow, with the tag name.
#
# Secrets (repository secrets): PPA_GPG_KEY is an armored, passphrase-less
# private key made only for this job and registered on the Launchpad account;
# a leak then only allows uploads to that PPA.
name: PPA upload

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to upload (e.g. 1.2.0)
        required: true

permissions:
  contents: read

jobs:
  upload:
    name: Build and upload source packages
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SERIES: jammy noble resolute
    steps:
      - name: Check the tag name
        run: |
          [[ "$TAG" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "bad tag name"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the orig tarball is made from the tag with git archive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev debhelper devscripts dput gnupg
      - name: Import the signing key
        env:
          PPA_GPG_KEY: ${{ secrets.PPA_GPG_KEY }}
        run: |
          printf '%s\n' "$PPA_GPG_KEY" | gpg --batch --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "DEBSIGN_KEYID=$fpr" >> "$GITHUB_ENV"
      - name: Build the signed source packages
        run: scripts/build-ppa-source.sh "$TAG" $SERIES
      - name: Upload to the PPA
        run: |
          for f in dist/ppa/*_source.changes; do
            dput ppa:hbenali/logscrub "$f"
          done
